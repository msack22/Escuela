version: '3.8'

services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: concursos_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: tu_password
      MYSQL_DATABASE: concursos_db
      MYSQL_USER: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - concursos_network

  # Redis para caché y colas
  redis:
    image: redis:7-alpine
    container_name: concursos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - concursos_network

  # Backend Python FastAPI
  backend:
    build: ./backend
    container_name: concursos_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://root:tu_password@mysql:3306/concursos_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    volumes:
      - ./backend:/app
    networks:
      - concursos_network

  # Frontend React
  frontend:
    build: ./frontend
    container_name: concursos_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - concursos_network

volumes:
  mysql_data:
  redis_data:

networks:
  concursos_network:
    driver: bridge
